[package]
name    = "brxon"
version = "0.1.0"
edition = "2021"

[lib]
name       = "brxon"
path       = "lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "build_filter"
path = "build_filter.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2          = "0.10"
hex           = "0.4"
rand          = "0.8"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
bincode    = "1.3"
murmur3 = "0.5"
base64  = "0.21"
thiserror = "1"
anyhow    = "1"
tracing   = "0.1"
parking_lot = "0.12"
mozilla-central-workspace-hack = { version = "0.1", features = ["brxon"], optional = true }
